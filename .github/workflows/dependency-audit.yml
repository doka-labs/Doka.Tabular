name: Dependency Audit
run-name: ${{ inputs.maintenance && format('maintenance {0}', inputs.schedule-correlation) || 'Dependency Audit' }}

# Audits every project for known vulnerabilities every night on main, and on
# every other active release line when the release-lines coordinator
# dispatches it.

on:
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:
    inputs:
      maintenance:
        type: boolean
        default: false
      schedule-correlation:
        type: string
        default: ""
      schedule-source-sha:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  guard:
    uses: doka-labs/workflows/.github/workflows/release-line-guard.yml@abbb17a2390d9bd58f23aa2495ebc481964e5cb4 # v0.5.1
    with:
      maintenance: ${{ inputs.maintenance || false }}
      schedule-correlation: ${{ inputs.schedule-correlation || '' }}
      schedule-source-sha: ${{ inputs.schedule-source-sha || '' }}

  dependency-audit:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    uses: doka-labs/workflows/.github/workflows/dependency-audit.yml@abbb17a2390d9bd58f23aa2495ebc481964e5cb4 # v0.5.1
