name: Pack

# Packs every shipping project of the solution with its symbol package and
# uploads them as one artifact. CI packs the version of
# src/Directory.Build.props with its -dev suffix; the release candidate passes
# the version it qualifies.

on:
  workflow_call:
    inputs:
      version:
        description: Version to pack; empty packs the version of src/Directory.Build.props.
        type: string
        default: ""
    outputs:
      version:
        description: Package version of the packed packages.
        value: ${{ jobs.pack.outputs.version }}

permissions:
  contents: read

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-26.04
    # WHY: A bound against hangs; restore, build and pack of both packages take a few minutes.
    timeout-minutes: 20
    outputs:
      version: ${{ steps.pack.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the .NET SDK of global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore the locked dependency graph
        run: dotnet restore Doka.Tabular.slnx --locked-mode

      # WHY: A release passes Version as well as PackageVersion: Version sets the assembly versions and the release
      # notes link, PackageVersion the package identity, which src/Directory.Build.props otherwise defaults to
      # <VersionPrefix>-dev. Only the projects under src/ ship; packing the solution would also visit the samples,
      # whose web SDK reports that packing is disabled. The packed version is read back from the project, so the
      # output names what was packed.
      - name: Pack the shipping projects
        id: pack
        env:
          VERSION: ${{ inputs.version }}
        run: |
          arguments=()
          if [ -n "$VERSION" ]; then
            arguments+=("-p:Version=$VERSION" "-p:PackageVersion=$VERSION")
          fi
          for project in src/*/*.csproj; do
            dotnet pack "$project" --configuration Release --no-restore --output "$RUNNER_TEMP/packages" "${arguments[@]}"
          done
          packed="$(dotnet msbuild src/Doka.Tabular/Doka.Tabular.csproj -getProperty:PackageVersion "${arguments[@]}")"
          echo "version=$packed" >> "$GITHUB_OUTPUT"

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            ${{ runner.temp }}/packages/*.nupkg
            ${{ runner.temp }}/packages/*.snupkg
          if-no-files-found: error
