name: Dependency Review

# Reviews the dependency delta of every pull request. It is a workflow of its
# own because it runs only for pull requests, while the CI gate also judges
# pushes to main.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    uses: doka-labs/workflows/.github/workflows/dependency-review.yml@a596aa23387b467c9b6f3206ca7582f5a8d30a21 # v0.1.1
