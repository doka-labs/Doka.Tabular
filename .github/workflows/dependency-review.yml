name: Dependency Review

# Reviews the dependency delta of every pull request. It is a workflow of its
# own because it runs only for pull requests, while the CI gate also judges
# pushes to main.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    uses: doka-labs/workflows/.github/workflows/dependency-review.yml@67433b1335bdbc11a0d67f27573a3e0ed009fdb9 # v0.2.0
