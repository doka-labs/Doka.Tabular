name: Release Lines

# Starts the nightly audit on every active release line other than main and
# verifies each run.

on:
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    permissions:
      contents: read
      actions: write
    uses: doka-labs/workflows/.github/workflows/release-lines-coordinator.yml@15567daa9c4c37ffa6477f7562995e9ef861fe0b # v0.6.1
    with:
      workload: audit
