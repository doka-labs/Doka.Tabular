name: Release Lines

# Starts the nightly audit on every active release line other than main and
# verifies each run.

on:
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    permissions:
      contents: read
      actions: write
    uses: doka-labs/workflows/.github/workflows/release-lines-coordinator.yml@abbb17a2390d9bd58f23aa2495ebc481964e5cb4 # v0.5.1
    with:
      workload: audit
