name: Release Lines

# Starts the nightly audit on every active release line other than main and
# verifies each run.

on:
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    permissions:
      contents: read
      actions: write
    uses: doka-labs/workflows/.github/workflows/release-lines-coordinator.yml@a596aa23387b467c9b6f3206ca7582f5a8d30a21 # v0.1.1
    with:
      workload: audit
