name: Release Lines

# Starts the nightly audit on every active release line other than main and
# verifies each run.

on:
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    permissions:
      contents: read
      actions: write
    uses: doka-labs/workflows/.github/workflows/release-lines-coordinator.yml@a3c0c35f11f1b657c09233ef02609cf75af1a1ba # v0.5.0
    with:
      workload: audit
