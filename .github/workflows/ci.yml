name: CI

# Checks every pull request, and main once a week or on demand, with the shared
# Doka Labs workflows and this repository's test matrix. A documentation-only
# pull request skips the heavy jobs; the required gate judges all of them.

# WHY: A merge lands only a tree that its pull request checked against the
# current main, and every release run repeats all gates, so a run after each
# merge would check the same tree again. The weekly run checks main against the
# current runner and gives the status badge a run on the default branch.
on:
  pull_request:
  schedule:
    - cron: "35 5 * * 4"
  workflow_dispatch:

permissions:
  contents: read

# WHY: A new push to the same pull request or branch makes the running checks obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    uses: doka-labs/workflows/.github/workflows/change-scope.yml@15567daa9c4c37ffa6477f7562995e9ef861fe0b # v0.6.1

  lint:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    uses: doka-labs/workflows/.github/workflows/workflow-lint.yml@15567daa9c4c37ffa6477f7562995e9ef861fe0b # v0.6.1

  policy:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    uses: doka-labs/workflows/.github/workflows/release-policy-check.yml@15567daa9c4c37ffa6477f7562995e9ef861fe0b # v0.6.1

  style:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    uses: doka-labs/workflows/.github/workflows/code-style.yml@15567daa9c4c37ffa6477f7562995e9ef861fe0b # v0.6.1
    with:
      solution: Doka.Tabular.slnx

  # WHY: Decision records are documentation, so the check runs for docs pull requests too and is not skippable.
  decision-records:
    uses: doka-labs/workflows/.github/workflows/decision-records.yml@15567daa9c4c37ffa6477f7562995e9ef861fe0b # v0.6.1

  # WHY: The document describes the code, so the check runs for docs pull requests too and is not skippable.
  architecture-document:
    uses: doka-labs/workflows/.github/workflows/architecture-document.yml@15567daa9c4c37ffa6477f7562995e9ef861fe0b # v0.6.1
    with:
      solution: Doka.Tabular.slnx

  tests:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    uses: $/.github/workflows/tests.yml

  # WHY: The gate merges the reports of every test job of this run, so it waits for all of them.
  coverage:
    needs: [scope, tests]
    if: needs.scope.outputs.scope == 'full'
    permissions:
      contents: read
      actions: read
    uses: doka-labs/workflows/.github/workflows/coverage-gate.yml@15567daa9c4c37ffa6477f7562995e9ef861fe0b # v0.6.1
    with:
      reports-pattern: coverage-*

  pack:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    uses: $/.github/workflows/pack.yml

  # WHY: A package problem shows up in the pull request with the candidate's checks, not first in a release.
  packages:
    needs: [scope, pack]
    if: needs.scope.outputs.scope == 'full'
    permissions:
      contents: read
      actions: read
    uses: doka-labs/workflows/.github/workflows/package-check.yml@15567daa9c4c37ffa6477f7562995e9ef861fe0b # v0.6.1
    with:
      version: ${{ needs.pack.outputs.version }}
      packages-artifact: packages

  required:
    needs: [scope, lint, policy, style, decision-records, architecture-document, tests, coverage, pack, packages]
    if: always()
    uses: doka-labs/workflows/.github/workflows/required-gate.yml@15567daa9c4c37ffa6477f7562995e9ef861fe0b # v0.6.1
    with:
      results: ${{ toJSON(needs) }}
      scope: ${{ needs.scope.outputs.scope }}
      skippable: '["lint", "policy", "style", "tests", "coverage", "pack", "packages"]'

  # WHY: The release qualification later accepts the tested merge tree of a pull request only with this
  # attestation; it requires the gate job of this run to have succeeded. always() keeps a documentation-only
  # pull request attested: without it, the skipped jobs before the gate would skip this job too.
  attest:
    needs: required
    if: always() && github.event_name == 'pull_request' && needs.required.result == 'success'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: doka-labs/workflows/.github/workflows/release-pr-attestation.yml@15567daa9c4c37ffa6477f7562995e9ef861fe0b # v0.6.1
