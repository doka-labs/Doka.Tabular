name: Tests

# Runs every test project once, the MySQL tests once per engine, and uploads
# per job a Cobertura coverage report and the TRX results. CI and the release
# candidate call it, so both run the same matrix.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-26.04
    # WHY: A bound against hangs; the database tests start their server in a container first.
    timeout-minutes: 30
    strategy:
      # WHY: Every project and engine reports its own result instead of stopping at the first failure.
      fail-fast: false
      matrix:
        # WHY: One test project per process. The MySQL tests run once per engine stage of
        # docker/database-images.Dockerfile, selected through DOKA_TABULAR_MYSQL_TARGET.
        include:
          - name: Core
            project: Doka.Tabular.Tests
            target: ""
            artifact: core
          - name: Csv
            project: Doka.Tabular.Csv.Tests
            target: ""
            artifact: csv
          - name: Excel
            project: Doka.Tabular.Excel.Tests
            target: ""
            artifact: excel
          - name: EF Core
            project: Doka.Tabular.EntityFrameworkCore.Tests
            target: ""
            artifact: entityframeworkcore
          - name: PostgreSQL
            project: Doka.Tabular.EntityFrameworkCore.PostgreSql.Tests
            target: ""
            artifact: entityframeworkcore-postgresql
          - name: Samples
            project: Doka.Tabular.Samples.Tests
            target: ""
            artifact: samples
          - name: Benchmarks
            project: Doka.Tabular.Benchmarks.Tests
            target: ""
            artifact: benchmarks
          - name: MariaDB 10.11
            project: Doka.Tabular.EntityFrameworkCore.MySql.Tests
            target: "mariadb1011"
            artifact: entityframeworkcore-mysql-mariadb1011
          - name: MariaDB 11.4
            project: Doka.Tabular.EntityFrameworkCore.MySql.Tests
            target: "mariadb114"
            artifact: entityframeworkcore-mysql-mariadb114
          - name: MariaDB 11.8
            project: Doka.Tabular.EntityFrameworkCore.MySql.Tests
            target: "mariadb118"
            artifact: entityframeworkcore-mysql-mariadb118
          - name: MariaDB 12.3
            project: Doka.Tabular.EntityFrameworkCore.MySql.Tests
            target: "mariadb123"
            artifact: entityframeworkcore-mysql-mariadb123
          - name: MySQL 8.4
            project: Doka.Tabular.EntityFrameworkCore.MySql.Tests
            target: "mysql84"
            artifact: entityframeworkcore-mysql-mysql84
          - name: MySQL 9.7
            project: Doka.Tabular.EntityFrameworkCore.MySql.Tests
            target: "mysql97"
            artifact: entityframeworkcore-mysql-mysql97

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the .NET SDK of global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore the locked dependency graph
        run: dotnet restore Doka.Tabular.slnx --locked-mode

      # WHY: Coverage starts only with the coverlet switch; tests/Shared/testconfig.json sets its format and filter.
      # xUnit writes the TRX results the release qualification reads with --report-xunit-trx. Both files get a fixed
      # name so each upload names one file.
      - name: Run the tests with coverage and TRX results
        env:
          PROJECT: ${{ matrix.project }}
          ARTIFACT: ${{ matrix.artifact }}
          DOKA_TABULAR_MYSQL_TARGET: ${{ matrix.target }}
        run: |
          dotnet test --project "tests/$PROJECT" --configuration Release --no-restore \
            --results-directory "$RUNNER_TEMP/results" -- --coverlet --report-xunit-trx \
            --report-xunit-trx-filename "$ARTIFACT.trx"
          mv "$RUNNER_TEMP"/results/coverage.cobertura.*.xml "$RUNNER_TEMP/coverage.cobertura.xml"

      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.artifact }}
          path: ${{ runner.temp }}/coverage.cobertura.xml
          if-no-files-found: error

      - name: Upload the TRX results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.artifact }}
          path: ${{ runner.temp }}/results/${{ matrix.artifact }}.trx
          if-no-files-found: error
