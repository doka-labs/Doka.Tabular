name: Pull Request

# Assigns the author of a new or reopened pull request.

on:
  pull_request:
    types:
      - opened
      - reopened

permissions: {}

jobs:
  assign:
    permissions:
      pull-requests: write
    uses: doka-labs/workflows/.github/workflows/pr-assign.yml@15567daa9c4c37ffa6477f7562995e9ef861fe0b # v0.6.1
