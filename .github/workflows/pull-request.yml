name: Pull Request

# Assigns the author of a new or reopened pull request.

on:
  pull_request:
    types:
      - opened
      - reopened

permissions: {}

jobs:
  assign:
    permissions:
      pull-requests: write
    uses: doka-labs/workflows/.github/workflows/pr-assign.yml@a596aa23387b467c9b6f3206ca7582f5a8d30a21 # v0.1.1
