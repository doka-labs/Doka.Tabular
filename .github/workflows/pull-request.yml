name: Pull Request

# Assigns the author of a new or reopened pull request.

on:
  pull_request:
    types:
      - opened
      - reopened

permissions: {}

jobs:
  assign:
    permissions:
      pull-requests: write
    uses: doka-labs/workflows/.github/workflows/pr-assign.yml@67433b1335bdbc11a0d67f27573a3e0ed009fdb9 # v0.2.0
