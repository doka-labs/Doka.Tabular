name: Pull Request

# Assigns the author of a new or reopened pull request.

on:
  pull_request:
    types:
      - opened
      - reopened

permissions: {}

jobs:
  assign:
    permissions:
      pull-requests: write
    uses: doka-labs/workflows/.github/workflows/pr-assign.yml@a3c0c35f11f1b657c09233ef02609cf75af1a1ba # v0.5.0
