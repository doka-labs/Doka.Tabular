name: Release Candidate

# Releases a version from the head of a release line: preflight, the test
# matrix and the packages of this repository, qualification, the candidate as
# a draft release, and after the signed tag and the approval in the nuget
# environment the publication to nuget.org and the API reference site.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version, for example 1.0.0-rc.1.
        type: string
        required: true
      qualification-only:
        description: Qualify without creating a candidate, for example on a prepared line.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    permissions:
      contents: write
      attestations: read
    uses: doka-labs/workflows/.github/workflows/release-preflight.yml@15567daa9c4c37ffa6477f7562995e9ef861fe0b # v0.6.1
    with:
      version: ${{ inputs.version }}
      qualification-only: ${{ inputs.qualification-only }}

  tests:
    needs: preflight
    if: needs.preflight.outputs.resume == 'false'
    uses: $/.github/workflows/tests.yml

  pack:
    needs: preflight
    if: needs.preflight.outputs.resume == 'false'
    uses: $/.github/workflows/pack.yml
    with:
      version: ${{ inputs.version }}

  qualification:
    needs: [preflight, tests, pack]
    if: needs.preflight.outputs.resume == 'false'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: doka-labs/workflows/.github/workflows/release-qualification.yml@15567daa9c4c37ffa6477f7562995e9ef861fe0b # v0.6.1
    with:
      version: ${{ inputs.version }}
      qualification-only: ${{ inputs.qualification-only }}
      test-results-pattern: test-results-*

  candidate:
    needs: [preflight, qualification]
    if: needs.preflight.outputs.resume == 'false' && !inputs.qualification-only
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: doka-labs/workflows/.github/workflows/release-candidate.yml@15567daa9c4c37ffa6477f7562995e9ef861fe0b # v0.6.1
    with:
      version: ${{ inputs.version }}
      packages-artifact: packages

  # WHY: nuget.org Trusted Publishing accepts only a token whose job_workflow_ref names this file, so the publish
  # job is defined here and calls the shared action instead of a shared workflow.
  # https://github.com/NuGet/NuGetGallery/blob/main/src/NuGetGallery.Services/Authentication/Federated/GitHubTokenPolicyValidator.cs
  publish:
    needs: [preflight, candidate]
    if: ${{ !cancelled() && !inputs.qualification-only && (needs.candidate.result == 'success' || needs.preflight.outputs.resume == 'true') }}
    # WHY: contents write lists the draft and publishes the release; id-token signs the admission and obtains the
    # NuGet credential through Trusted Publishing; attestations write stores the admission. actions read is the
    # repository permission of "GET /repos/{owner}/{repo}/environments/{environment_name}" and of its deployment
    # branch policies, which the environment check reads.
    # https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
    # https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    # WHY: The environment is release.environment of .github/release-policy.json and of the nuget.org policy; its
    # reviewers approve the publication, and nuget.org accepts the token of NuGet/login only from this environment.
    environment: nuget
    # WHY: Publications of one repository run one after another and are never cancelled midway; queue: max keeps
    # up to 100 waiting. https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idconcurrency
    concurrency:
      group: ${{ github.repository }}-publication
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-26.04
    # WHY: Successful publish jobs of the other Doka Labs repositories took up to 60.1 minutes, and the NuGet readback
    # alone may wait one hour.
    timeout-minutes: 180
    steps:
      - name: Publish the approved candidate
        uses: doka-labs/workflows/.github/actions/release-publish@15567daa9c4c37ffa6477f7562995e9ef861fe0b # v0.6.1
        with:
          tag: ${{ needs.preflight.outputs.tag }}
          nuget-user: ${{ secrets.NUGET_USER }}

  # WHY: A resumed run skips candidate, and a skip passes to every job that needs it unless the job has its own
  # condition; run 45908860276 skipped the site that way. The shared workflow deploys only a published release.
  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idneeds
  api-reference:
    needs: [preflight, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: doka-labs/workflows/.github/workflows/api-reference.yml@15567daa9c4c37ffa6477f7562995e9ef861fe0b # v0.6.1
    with:
      tag: ${{ needs.preflight.outputs.tag }}
